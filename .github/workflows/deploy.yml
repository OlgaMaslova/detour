name: Deploy

# Production deploys on every push to main. Work happens on dev; merging dev
# into main is the release. Nothing deploys from any other branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race. Queue rather than cancel: a cancelled deploy can
# leave the Worker and the API on mismatched versions.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  frontend:
    name: Worker (detour-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Before the build, because the contract these cover is one a build cannot
      # break loudly: the app and the Worker compute a place's address from the
      # same functions, and a divergence puts the wrong place — or no place — in
      # the preview card a link shows in a chat.
      - run: npm test

      # The Maps key reaches the bundle from here rather than from
      # .env.production, which is tracked: a committed key is one that has to be
      # rotated out of git history rather than out of a settings page. It is a
      # browser key and ends up readable in the bundle either way — what actually
      # protects it is the HTTP referrer restriction on the key itself. The map ID
      # is not a secret at all and rides along for the same reason.
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}

      # Guard against the failure that is invisible until users hit it: Vite
      # loads .env.local during production builds, so a stray local env file
      # silently bakes localhost into the bundle and the deployed site reaches
      # nothing. Fail the deploy here rather than ship it.
      - name: Verify bundle targets the production API
        run: |
          if ! grep -qh "api\.takedetour\.app" public/assets/*.js; then
            echo "::error::Bundle does not reference api.takedetour.app"
            exit 1
          fi
          if grep -qh "127\.0\.0\.1:8090\|localhost:8090" public/assets/*.js; then
            echo "::error::Bundle contains a localhost API URL"
            exit 1
          fi
          if grep -qh "sn-pb-repo-[a-z0-9-]*\.fly\.dev" public/assets/*.js; then
            echo "::error::Bundle still references the decommissioned managed backend host"
            exit 1
          fi

      # Warnings, not failures. A keyless bundle still ships working maps — it
      # falls back to Leaflet over OpenStreetMap — so neither state is worth
      # blocking a release that is about something else. What they are worth is
      # saying out loud, because both are easy to ship without noticing.
      #
      # These test the secrets rather than grepping the bundle: the Leaflet chunk
      # is emitted either way and the Google loader URL is a source literal, so
      # what a build produced is not a signal. Actions masks the values in logs.
      - name: Note which map provider this build shipped
        env:
          MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          MAPS_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
        run: |
          if [ -z "$MAPS_KEY" ]; then
            echo "::warning::No Maps API key — production is serving the Leaflet/OpenStreetMap fallback. That works, but it is the development path. Set VITE_GOOGLE_MAPS_API_KEY to ship Google."
          elif [ -z "$MAPS_ID" ]; then
            echo "::warning::Maps key set but no map ID — falling back to Google's DEMO_MAP_ID, which is unstyled and for testing only. Set VITE_GOOGLE_MAPS_MAP_ID to carry the tape palette."
          else
            echo "Shipping Google Maps with a styled map ID."
          fi

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        run: |
          for host in https://takedetour.app https://api.takedetour.app/api/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 "$host?ci=${{ github.sha }}")
            echo "$host -> $code"
            [ "$code" = "200" ] || exit 1
          done

  backend:
    name: PocketBase (takedetour-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A Fly deploy restarts the machine, and PocketBase is a single node on a
      # single volume — so the API is briefly down. Only pay that cost when
      # something the image actually contains has changed.
      - id: check
        name: Did anything the backend image contains change?
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ -z "$base" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base — deploying to be safe."
          elif git diff --name-only "$base" "${{ github.sha }}" \
               | grep -qE '^(pb_hooks/|pb_migrations/|pb_public/|Dockerfile$|fly\.toml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No backend paths touched — skipping deploy, API stays up."
          fi

      - if: steps.check.outputs.changed == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - if: steps.check.outputs.changed == 'true'
        name: Deploy PocketBase
        # --ha=false is required: the default two machines cannot share one volume.
        run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - if: steps.check.outputs.changed == 'true'
        name: Wait for the API to come back
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 20 --retry-delay 5 --retry-connrefused \
            https://api.takedetour.app/api/health)
          echo "api health -> $code"
          [ "$code" = "200" ] || exit 1
